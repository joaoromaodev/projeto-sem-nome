<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>projeto sem nome</title>
<link rel="stylesheet" href="/v/__VER__/css/y2k.css">
<style>
  body { display: flex; align-items: center; justify-content: center; padding: 16px; overflow: auto; }
  .janela { width: 620px; max-width: 100%; }
  /* minmax(0,…) nas duas: sem isso um filho largo empurra a coluna
     pra fora em vez de encolher. */
  .grade {
    display: grid; grid-template-columns: 238px minmax(0, 1fr);
    gap: 16px; align-items: start;
  }
  .grade > * { min-width: 0; }
  .campo { margin-bottom: 10px; }
  .campo > label { display: block; font-weight: bold; margin-bottom: 3px; }
  #sala { width: 100%; }
  .aviso { font-size: 11px; margin-top: 3px; }
  #entrar { width: 100%; padding: 8px; }
  .recado { font-size: 11px; min-height: 14px; margin-top: 6px; }
  .recado.ruim { color: #a00; }
  .recado.bom { color: #060; }
  .topo { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .topo .quem { flex: 1; font-size: 12px; }
  .topo button { padding: 3px 10px; font-size: 11px; }

  /* ---- lista de salas ---- */
  #salas { max-height: 196px; overflow-y: auto; }
  .sala {
    display: flex; align-items: center; gap: 7px;
    padding: 4px 5px; cursor: pointer;
    border: 1px solid transparent;
  }
  .sala:hover { background: #000080; color: #fff; }
  .sala:hover .dim { color: #c8c8e0; }
  .sala.lobby { border-color: var(--sombra); background: #eceCf4; }
  .sala.lobby:hover { background: #000080; }
  .sala .nomes { flex: 1; min-width: 0; }
  .sala .cod { font-weight: bold; font-size: 12px; }
  .sala .quem2 {
    font-size: 10px; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  .sala .conta2 { font-size: 11px; flex: none; }
  /* Os bonequinhos da amostra ficam sobrepostos pra caber mais de um.
     A altura tem que acompanhar o canvas do sprite (ALT_CANVAS = 51: são
     os 48 do boneco mais a folga do pulo). Menos que isso e o boneco vaza
     pra fora da linha, por cima da legenda — já aconteceu. */
  .caras { display: flex; flex: none; height: 51px; align-items: flex-end; }
  .caras canvas { image-rendering: pixelated; margin-right: -10px; }
  .caras canvas:last-child { margin-right: 0; }
  .vazio { font-size: 11px; padding: 6px 4px; }
  /* "suas salas" é atalho, não catálogo: linha compacta, sem bonequinho.
     Quem já frequenta o lugar não precisa que a lista o descreva. */
  #minhas { max-height: 118px; overflow-y: auto; }
  .minha {
    display: flex; align-items: baseline; gap: 6px;
    padding: 3px 5px; cursor: pointer;
  }
  .minha:hover { background: #000080; color: #fff; }
  .minha:hover .dim { color: #c8c8e0; }
  .minha .cod { font-weight: bold; font-size: 12px; flex: 1; min-width: 0;
                overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .minha .sinal { font-size: 10px; flex: none; }
  .minha .sinal.acesa { color: #060; font-weight: bold; }
  .minha:hover .sinal.acesa { color: #7f7; }
</style>
</head>
<body>

<div class="win janela">
  <div class="tbar">
    <span class="t">■ projeto_sem_nome.exe</span>
    <span class="b">_</span><span class="b">□</span><span class="b">✕</span>
  </div>
  <div class="corpo">

    <div class="topo">
      <span class="quem dim">conectado como <b id="quemSou">…</b></span>
      <button id="sair">Sair da conta</button>
    </div>

    <div class="grade">
      <fieldset>
        <legend>Seu boneco</legend>
        <div id="editor"></div>
      </fieldset>

      <div>
        <fieldset id="boxMinhas" hidden>
          <legend>Suas salas</legend>
          <div id="minhas"></div>
        </fieldset>

        <fieldset style="margin-top:14px;">
          <legend>Onde tem gente agora</legend>
          <div id="salas"><p class="dim vazio">carregando...</p></div>
        </fieldset>

        <div class="campo" style="margin-top:14px;">
          <label for="sala">Ou entre por nome</label>
          <input type="text" id="sala" maxlength="32" placeholder="ex: quinta a noite" autocomplete="off">
          <p class="dim aviso">
            Quem digitar o mesmo nome cai na mesma sala.<br>
            Sala que não existe é criada na hora.
          </p>
        </div>

        <button id="entrar">Entrar na sala &gt;</button>
        <p class="recado" id="recado"></p>

        <fieldset style="margin-top:14px;">
          <legend>Trocar senha</legend>
          <div class="campo">
            <label for="senhaAtual">Senha atual</label>
            <input type="password" id="senhaAtual" style="width:100%" autocomplete="current-password">
          </div>
          <div class="campo">
            <label for="senhaNova">Senha nova</label>
            <input type="password" id="senhaNova" style="width:100%" autocomplete="new-password">
          </div>
          <button id="trocarSenha" style="padding:4px 12px; font-size:12px;">Trocar</button>
          <p class="recado" id="recadoSenha"></p>
        </fieldset>
      </div>
    </div>

  </div>
</div>

<script type="module">
import { api, adiar } from "/v/__VER__/js/api.js";
import { montarPainel } from "/v/__VER__/js/editor.js";
import { normalizar, definirManifesto, canvasAvatar } from "/v/__VER__/js/avatar.js";
import { preaquecer } from "/v/__VER__/js/sprites.js";

const $ = (s) => document.querySelector(s);

const [conta, manifesto] = await Promise.all([api.eu(), api.pecas()]);
// Sem o catálogo, o normalizar() não sabe quais peças valem e zeraria o
// boneco de todo mundo.
definirManifesto(manifesto);
await preaquecer(manifesto);
const perfil = { nick: conta.nick, avatar: normalizar(conta.avatar) };
$("#quemSou").textContent = conta.nick;

function recado(el, txt, bom = false) {
  el.textContent = txt;
  el.className = "recado " + (bom ? "bom" : "ruim");
  if (txt) setTimeout(() => { el.textContent = ""; }, 3500);
}

/* Grava com folga: o usuário fica clicando nas cores, não dá pra ir ao
   servidor a cada clique. */
const gravar = adiar(async () => {
  try {
    await api.salvarAvatar(perfil.avatar);
    if (perfil.nick.trim() && perfil.nick.trim() !== conta.nick) {
      const r = await api.trocarNick(perfil.nick.trim());
      conta.nick = r.nick;
      $("#quemSou").textContent = r.nick;
    }
  } catch (e) {
    recado($("#recado"), e.message);
  }
}, 500);

const painel = montarPainel($("#editor"), perfil, gravar, { esc: 3, comNick: true });

/* ---------- sala ---------- */
$("#sala").value = localStorage.getItem("psn.ultimaSala") || "";

function irPara(code) {
  localStorage.setItem("psn.ultimaSala", code);
  location.href = "/sala/" + encodeURIComponent(code);
}

function irParaSala() {
  const sala = $("#sala").value.trim();
  if (!sala) { $("#sala").focus(); return recado($("#recado"), "falta o nome da sala"); }
  irPara(sala);
}

$("#entrar").onclick = irParaSala;
$("#sala").addEventListener("keydown", (e) => { if (e.key === "Enter") irParaSala(); });

/* ---------- lista de salas ----------
   Sinal de vida, não nota: mostra quanta gente tem e quem são. A decisão
   que a pessoa toma olhando isso é "vale entrar?", e pra isso presença
   informa melhor que estrela — e não cria sala "mal avaliada". */

function cartao(s) {
  const el = document.createElement("div");
  el.className = "sala" + (s.lobby ? " lobby" : "");
  el.title = `entrar em "${s.code}"`;

  const caras = document.createElement("div");
  caras.className = "caras";
  for (const av of s.avatares) caras.appendChild(canvasAvatar(av, 1));

  const nomes = document.createElement("div");
  nomes.className = "nomes";
  const cod = document.createElement("div");
  cod.className = "cod";
  cod.textContent = s.lobby ? "lobby" : s.code;
  const quem = document.createElement("div");
  quem.className = "quem2 dim";
  quem.textContent = s.gente
    ? s.nicks.join(", ") + (s.gente > s.nicks.length ? ` +${s.gente - s.nicks.length}` : "")
    : (s.lobby ? "ninguém ainda — seja o primeiro" : "vazia");
  nomes.append(cod, quem);

  // O que está tocando é sinal de vida tanto quanto a contagem de gente —
  // mas só com o título. O id cru ("dQw4w9WgXcQ") não diz nada pra quem
  // olha a lista, então nesse caso é melhor não ocupar a linha.
  if (s.video_titulo) {
    const toca = document.createElement("div");
    toca.className = "quem2 dim";
    toca.textContent = "♪ " + s.video_titulo;
    nomes.appendChild(toca);
  }

  const conta2 = document.createElement("div");
  conta2.className = "conta2 dim";
  conta2.textContent = `${s.gente}/${s.limite}`;

  el.append(caras, nomes, conta2);
  el.onclick = () => irPara(s.code);
  return el;
}

async function carregarSalas() {
  let dados;
  try { dados = await api.salas(); } catch { return; }

  const alvo = $("#salas");
  alvo.textContent = "";
  for (const s of dados.salas) alvo.appendChild(cartao(s));
}

/* ---------- suas salas ----------
   A lista de cima é descoberta ("onde tem gente?"); esta é retorno
   ("cadê o meu lugar?"). São perguntas diferentes, então listas
   diferentes: aqui entra sala vazia, porque a sua sala vazia é um lugar
   que você conhece e pode querer abrir pra ser o primeiro. */

function linhaMinha(s) {
  const el = document.createElement("div");
  el.className = "minha";
  el.title = `entrar em "${s.code}"`;

  const cod = document.createElement("span");
  cod.className = "cod";
  cod.textContent = s.code;

  const sinal = document.createElement("span");
  sinal.className = "sinal dim" + (s.gente ? " acesa" : "");
  // Sala vazia mostra o que já tocou ali: é o que resta de sinal de vida
  // quando não tem ninguém, e é justamente o que a sala guardou por você.
  const n = s.musicas_ouvidas;
  sinal.textContent = s.gente
    ? `${s.gente} online`
    : (n ? `${n} música${n === 1 ? "" : "s"}` : "vazia");

  el.append(cod, sinal);
  el.onclick = () => irPara(s.code);
  return el;
}

async function carregarMinhas() {
  let dados;
  try { dados = await api.minhasSalas(); } catch { return; }

  // Quem nunca entrou em nada não precisa de um quadro vazio dizendo
  // isso — some até ter o que mostrar.
  $("#boxMinhas").hidden = dados.salas.length === 0;
  const alvo = $("#minhas");
  alvo.textContent = "";
  for (const s of dados.salas) alvo.appendChild(linhaMinha(s));
}

await Promise.all([carregarSalas(), carregarMinhas()]);
// A lista envelhece rápido (gente entra e sai). Recarrega enquanto a aba
// está à vista; em aba oculta não adianta gastar requisição.
setInterval(() => {
  if (document.visibilityState === "visible") {
    carregarSalas();
    carregarMinhas();
  }
}, 8000);

/* ---------- conta ---------- */
$("#sair").onclick = async () => {
  await api.sair();
  location.href = "/entrar";
};

$("#trocarSenha").onclick = async () => {
  const atual = $("#senhaAtual").value;
  const nova = $("#senhaNova").value;
  if (!atual || !nova) return recado($("#recadoSenha"), "preencha os dois campos");
  try {
    await api.trocarSenha(atual, nova);
    // trocar senha derruba todas as sessões, inclusive esta
    recado($("#recadoSenha"), "senha trocada — entrando de novo...", true);
    setTimeout(() => { location.href = "/entrar"; }, 1200);
  } catch (e) {
    recado($("#recadoSenha"), e.message);
  }
};
</script>
</body>
</html>
